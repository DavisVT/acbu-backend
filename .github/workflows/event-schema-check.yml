name: Event Schema Contract Check

on:
  pull_request:
    paths:
      - "shared/events-schema.json"
      - "src/jobs/acbu_*_event_listener.ts"
      - "scripts/check-event-schema.js"
      - "scripts/check-event-schema.test.js"
      - "package.json"
      - ".github/workflows/event-schema-check.yml"
  push:
    branches: [main, dev]
    paths:
      - "shared/events-schema.json"
      - "src/jobs/acbu_*_event_listener.ts"
      - "scripts/check-event-schema.js"
      - "scripts/check-event-schema.test.js"
      - "package.json"
      - ".github/workflows/event-schema-check.yml"

jobs:
  event-schema:
    name: Validate event schema contract
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.33.1

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check event schema
        run: pnpm run event-schema:check

      - name: Test event schema drift detection
        run: pnpm run test:event-schema
