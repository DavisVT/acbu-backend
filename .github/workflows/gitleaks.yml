# Secret-scanning CI gate — closes issue #767 (W2-B-057: No secrets scanning in CI).
# Fails the build if a real or test secret (e.g. a fake AWS key) is committed.
name: Secret Scan (gitleaks)

on:
  push:
    branches: [main, dev, develop]
  pull_request:
    branches: [main, dev, develop]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so gitleaks can scan the PR range / recent commits
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fail the job when secrets are detected
          GITLEAKS_ENABLE_COMMENTS: false
